<h2>Customer Contact Form</h2>

<form>

    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your name" required>
    <br><br>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email" required>
    <br><br>

    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Enter phone number">
    <br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    <label>Select Bandana:</label><br>
    <select>
        <option>Red Bandana</option>
        <option>Black Bandana</option>
        <option>Royal Blue Bandana</option>
        <option>Vintage Brown Bandana</option>
    </select>
    <br><br>

    <label>Your Message:</label><br>
    <textarea rows="5" cols="30"
    placeholder="Write your message"></textarea>
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

<footer>
    <p>© 2026 Heritage Bandanas</p>
</footer>

</body>
</html>
